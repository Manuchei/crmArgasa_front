name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novexapp-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build -- --configuration production

      - name: Preparar paquete
        run: |
          set -euo pipefail
          test -s dist/empresa.crm/browser/index.html
          test -s dist/empresa.crm/browser/custom-sw.js
          tar -czf frontend.tar.gz -C dist/empresa.crm/browser .

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Subir y activar versión
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
        run: |
          set -euo pipefail
          version="frontend-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          destino="${DEPLOY_USER}@${DEPLOY_HOST}"

          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            frontend.tar.gz \
            "${destino}:/var/www/novexapp-releases/${version}.tar.gz"

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$destino" "bash -s -- $version" <<'REMOTE'
          set -Eeuo pipefail
          base=/var/www/novexapp-releases
          version="$1"

          exec 9>"$base/.deploy.lock"
          flock -n 9

          anterior=$(readlink -f "$base/current")
          test -s "$anterior/index.html"
          test ! -e "$base/$version"
          mkdir "$base/$version"
          tar -xzf "$base/$version.tar.gz" -C "$base/$version"
          chmod -R a+rX "$base/$version"
          test -s "$base/$version/index.html"
          test -s "$base/$version/custom-sw.js"

          activar() {
            ln -sfn "$1" "$base/current.next"
            mv -Tf "$base/current.next" "$base/current"
          }

          recuperar() {
            trap - ERR
            activar "$anterior"
            echo "Comprobación fallida: versión anterior restaurada"
            exit 1
          }

          trap recuperar ERR
          activar "$base/$version"

          respuesta=$(mktemp)
          curl --fail --silent --show-error --max-time 15 \
            --resolve novexapp.es:443:127.0.0.1 \
            https://novexapp.es/index.html -o "$respuesta"
          cmp "$base/$version/index.html" "$respuesta"

          trap - ERR
          rm -f "$respuesta" "$base/$version.tar.gz"
          echo "Despliegue correcto: $version"
          REMOTE

      - name: Eliminar clave temporal
        if: always()
        run: rm -f ~/.ssh/deploy_key