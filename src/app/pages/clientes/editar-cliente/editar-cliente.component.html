<div class="container mt-4" *ngIf="cliente">
  <h3 class="text-center mb-4">Editar cliente</h3>

  <form (ngSubmit)="guardarCambios()" #formCliente="ngForm">
    <div class="row g-3">
      <!-- Nombre -->
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="cliente.nombre"
          name="nombre"
          required
        />
      </div>

      <!-- Apellido -->
      <div class="col-md-6">
        <label class="form-label">Apellido</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="cliente.apellido"
          name="apellido"
          required
        />
      </div>

      <!-- Empresa (desplegable) -->
      <div class="col-md-6">
        <label class="form-label">Empresa</label>
        <select
          class="form-select"
          [(ngModel)]="cliente.empresa"
          name="empresa"
          required
        >
          <option value="">Seleccionar empresa</option>
          <option value="Argasa">Argasa</option>
          <option value="Luga">Luga</option>
        </select>
      </div>

      <!-- Teléfono -->
      <div class="col-md-6">
        <label class="form-label">Teléfono</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="cliente.telefono"
          name="telefono"
        />
      </div>

      <!-- Email -->
      <div class="col-md-12">
        <label class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="cliente.email"
          name="email"
        />
      </div>
    </div>

    <!-- Botones -->
    <div class="text-end mt-4">
      <button
        type="button"
        class="btn btn-secondary me-2"
        (click)="cancelar()"
      >
        Cancelar
      </button>

      <button type="submit" class="btn btn-primary">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
