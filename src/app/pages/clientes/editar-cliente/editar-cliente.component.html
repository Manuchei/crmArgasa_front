<div class="cliente-form-page container-fluid mt-4" *ngIf="cliente">
  <h3 class="text-center mb-4">Editar cliente</h3>

  <form (ngSubmit)="guardarCambios()" #formCliente="ngForm">
    <div class="row g-3">

      <div class="col-12 col-lg-6">
        <label class="form-label">Nombre y apellidos *</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.nombreApellidos" name="nombreApellidos" required />
      </div>

      <div class="col-12 col-lg-6">
        <label class="form-label">Empresa</label>
        <input class="form-control" [value]="cliente?.empresa ?? ''" disabled />
      </div>

      <div class="col-12">
        <h5 class="mt-3">Dirección de facturación</h5>
      </div>

      <div class="col-12 col-lg-8">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.direccion" name="direccion" />
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <label class="form-label">Código Postal</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.codigoPostal" name="codigoPostal" />
      </div>

      <div class="col-12 col-md-6 col-lg-6">
        <label class="form-label">Población</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.poblacion" name="poblacion" />
      </div>

      <div class="col-12 col-md-6 col-lg-6">
        <label class="form-label">Provincia</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.provincia" name="provincia" />
      </div>

      <div class="col-12">
        <h5 class="mt-3">Dirección de entrega</h5>
      </div>

      <div class="col-12 col-lg-8">
        <label class="form-label">Dirección de entrega</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.direccionEntrega" name="direccionEntrega" />
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <label class="form-label">Código Postal entrega</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.codigoPostalEntrega" name="codigoPostalEntrega" />
      </div>

      <div class="col-12 col-md-6 col-lg-6">
        <label class="form-label">Población entrega</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.poblacionEntrega" name="poblacionEntrega" />
      </div>

      <div class="col-12 col-md-6 col-lg-6">
        <label class="form-label">Provincia entrega</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.provinciaEntrega" name="provinciaEntrega" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Número de cuenta</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.numeroCuenta" name="numeroCuenta"
          pattern="^\d{20}$" placeholder="Ej: 21000418450200051339" inputmode="numeric" maxlength="20"
          (ngModelChange)="formatearNumeroCuenta($event)" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">IBAN generado</label>
        <input type="text" class="form-control" [value]="formatearIbanVisual(cliente.iban)" readonly
          placeholder="Se genera automáticamente" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.telefono" name="telefono" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Móvil</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.movil" name="movil" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">CIF / DNI</label>
        <input type="text" class="form-control" [(ngModel)]="cliente.cifDni" name="cifDni" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="cliente.email" name="email" />
      </div>
    </div>

    <div class="form-actions text-end mt-4 d-flex justify-content-end gap-2 flex-wrap">
      <button type="button" class="btn btn-secondary" (click)="cancelar()">
        Cancelar
      </button>

      <button type="submit" class="btn btn-primary">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
