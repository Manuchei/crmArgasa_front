<div class="cliente-form-page container-fluid mt-4">
  <h3 class="text-center mb-4">Nuevo Cliente</h3>

  <form (ngSubmit)="guardarCliente(formCliente)" #formCliente="ngForm">
    <div class="row mb-3">
      <div class="col-12">
        <label>Nombre y apellidos o Empresa *</label>
        <input [(ngModel)]="cliente.nombreApellidos" name="nombreApellidos" class="form-control" required />
      </div>
    </div>

    <h5 class="mt-3">Dirección de facturación</h5>

    <div class="row mb-3 g-3">
      <div class="col-12 col-lg-8">
        <label>Dirección</label>
        <input [(ngModel)]="cliente.direccion" name="direccion" class="form-control" />
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <label>Código Postal</label>
        <input [(ngModel)]="cliente.codigoPostal" name="codigoPostal" class="form-control" />
      </div>
    </div>

    <div class="row mb-3 g-3">
      <div class="col-12 col-md-6">
        <label>Población</label>
        <input [(ngModel)]="cliente.poblacion" name="poblacion" class="form-control" />
      </div>

      <div class="col-12 col-md-6">
        <label>Provincia</label>
        <input [(ngModel)]="cliente.provincia" name="provincia" class="form-control" />
      </div>
    </div>

    <h5 class="mt-3">Dirección de entrega</h5>

    <div class="row mb-3 g-3">
      <div class="col-12 col-lg-8">
        <label>Dirección de entrega</label>
        <input [(ngModel)]="cliente.direccionEntrega" name="direccionEntrega" class="form-control" />
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <label>Código Postal entrega</label>
        <input [(ngModel)]="cliente.codigoPostalEntrega" name="codigoPostalEntrega" class="form-control" />
      </div>
    </div>

    <div class="row mb-3 g-3">
      <div class="col-12 col-md-6">
        <label>Población entrega</label>
        <input [(ngModel)]="cliente.poblacionEntrega" name="poblacionEntrega" class="form-control" />
      </div>

      <div class="col-12 col-md-6">
        <label>Provincia entrega</label>
        <input [(ngModel)]="cliente.provinciaEntrega" name="provinciaEntrega" class="form-control" />
      </div>
    </div>

    <div class="row mb-3 g-3">

      <div class="col-12 col-md-6">
        <label class="form-label">Número de cuenta *</label>

        <input type="text" class="form-control" [(ngModel)]="cliente.numeroCuenta" name="numeroCuenta"
          #numeroCuenta="ngModel" required pattern="^\d{20}$" placeholder="Ej: 21000418450200051339" inputmode="numeric"
          maxlength="20" (ngModelChange)="formatearNumeroCuenta($event)" />

        <div class="text-danger mt-1" *ngIf="numeroCuenta.touched && numeroCuenta.errors?.['required']">
          El número de cuenta es obligatorio.
        </div>

        <div class="text-danger mt-1" *ngIf="numeroCuenta.touched && numeroCuenta.errors?.['pattern']">
          Debe tener exactamente 20 dígitos.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">IBAN generado</label>

        <input type="text" class="form-control" [value]="formatearIbanVisual(cliente.iban)" readonly
          placeholder="Se genera automáticamente" />
      </div>

    </div>

    <div class="row mb-3 g-3">
      <div class="col-12 col-md-6">
        <label>Teléfono</label>
        <input [(ngModel)]="cliente.telefono" name="telefono" class="form-control" />
      </div>

      <div class="col-12 col-md-6">
        <label>Móvil</label>
        <input [(ngModel)]="cliente.movil" name="movil" class="form-control" />
      </div>
    </div>

    <div class="row mb-3 g-3">
      <div class="col-12 col-md-6">
        <label>CIF / DNI</label>
        <input [(ngModel)]="cliente.cifDni" name="cifDni" class="form-control" />
      </div>

      <div class="col-12 col-md-6">
        <label>Email</label>
        <input [(ngModel)]="cliente.email" name="email" class="form-control" />
      </div>
    </div>



    <div class="text-end mt-3 form-actions">
      <button class="btn btn-success" type="submit" [disabled]="formCliente.invalid">
        Guardar cliente
      </button>
    </div>
  </form>
</div>
