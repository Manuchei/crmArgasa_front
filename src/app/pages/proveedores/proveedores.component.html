<div class="container mt-4">

  <h2 class="mb-3">Listado de Proveedores</h2>

  <!-- FILTROS -->
  <div class="card p-3 mb-4">
    <div class="row">

      <div class="col-md-4">
        <label>Buscar por nombre</label>
        <input type="text" class="form-control" [(ngModel)]="filtros.texto" (input)="filtrar()">
      </div>

      <div class="col-md-4">
        <label>Empresa</label>
        <select class="form-control" [(ngModel)]="filtros.empresa" (change)="filtrar()">
          <option value="">Todas</option>
          <option value="argasa">Argasa</option>
          <option value="luga">Electroluga</option>
        </select>
      </div>

      <div class="col-md-4">
        <label>Oficio</label>
        <select class="form-control" [(ngModel)]="filtros.oficio" (change)="filtrar()">
          <option value="">Todos</option>
          <option value="electricista">Electricista</option>
          <option value="fontanero">Fontanero</option>
          <option value="pintor">Pintor</option>
          <option value="albañil">Albañil</option>
          <option value="carpintero">Carpintero</option>
        </select>
      </div>

    </div>

    <div class="mt-3 text-end">
      <button class="btn btn-secondary btn-sm" (click)="limpiarFiltros()">Limpiar filtros</button>
    </div>
  </div>

  <a routerLink="/proveedores/nuevo" class="btn btn-success mb-3">
    + Nuevo Proveedor
  </a>

  <!-- LISTADO -->
  <table class="table table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Oficio</th>
        <th>Empresa</th>
        <th>Teléfono</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of proveedores" style="cursor:pointer">
        
        <td (click)="verProveedor(p.id)">{{ p.nombre }}</td>
        <td (click)="verProveedor(p.id)">{{ p.apellido }}</td>
        <td (click)="verProveedor(p.id)">{{ p.oficio }}</td>
        <td (click)="verProveedor(p.id)">
          <span *ngIf="p.trabajaEnArgasa">Argasa</span>
          <span *ngIf="p.trabajaEnLuga">Electroluga</span>
        </td>
        <td (click)="verProveedor(p.id)">{{ p.telefono }}</td>

        <!-- ACCIONES -->
        <td class="text-center">

          <button class="btn btn-sm btn-outline-primary me-1"
                  (click)="verProveedor(p.id)">
            🔍 Ver
          </button>

          <button class="btn btn-sm btn-outline-warning me-1"
                  (click)="editarProveedor(p.id)">
            ✏️ Editar
          </button>

          <button class="btn btn-sm btn-outline-danger"
                  (click)="eliminarProveedor(p.id)">
            🗑 Eliminar
          </button>

        </td>

      </tr>
    </tbody>
  </table>

</div>
