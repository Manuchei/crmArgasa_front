<div class="proveedor-form-page container-fluid mt-4">
  <h3>Editar proveedor</h3>

  <div class="card p-4 shadow-sm">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Nombre</label>
        <input class="form-control" [(ngModel)]="proveedor.nombre" name="nombre">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">CIF</label>
        <input class="form-control" [(ngModel)]="proveedor.cif" name="cif">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Fecha alta proveedor</label>
        <input type="date" class="form-control" [(ngModel)]="proveedor.fechaAltaProveedor" name="fechaAltaProveedor">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Oficio</label>
        <select class="form-control" [(ngModel)]="proveedor.oficio" name="oficio">
          <option value="">Seleccione un oficio...</option>
          <option *ngFor="let o of oficios" [value]="o">{{ o }}</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Dirección</label>
        <input class="form-control" [(ngModel)]="proveedor.direccion" name="direccion">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Localidad</label>
        <input class="form-control" [(ngModel)]="proveedor.localidad" name="localidad">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Código postal</label>
        <input class="form-control" [(ngModel)]="proveedor.codigoPostal" name="codigoPostal">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Provincia</label>
        <input class="form-control" [(ngModel)]="proveedor.provincia" name="provincia">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">País</label>
        <input class="form-control" [(ngModel)]="proveedor.pais" name="pais">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Teléfono</label>
        <input class="form-control" [(ngModel)]="proveedor.telefono" name="telefono">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="proveedor.email" name="email">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Contacto</label>
        <input class="form-control" [(ngModel)]="proveedor.contacto" name="contacto">
      </div>

      <div class="col-12">
  <label class="form-label">Datos bancarios</label>
  <textarea
    class="form-control"
    rows="3"
    [(ngModel)]="proveedor.datosBancarios"
    name="datosBancarios">
  </textarea>
</div>

<div class="col-12 col-md-6">
  <label class="form-label">Número de cuenta</label>
  <input
    type="text"
    class="form-control"
    [(ngModel)]="proveedor.numeroCuenta"
    name="numeroCuenta"
    pattern="^\d{20}$"
    placeholder="Ej: 21000418450200051339"
    inputmode="numeric"
    maxlength="20"
    (ngModelChange)="formatearNumeroCuenta($event)"
  />
</div>

<div class="col-12 col-md-6">
  <label class="form-label">IBAN generado</label>
  <input
    type="text"
    class="form-control"
    [value]="formatearIbanVisual(proveedor.iban)"
    readonly
    placeholder="Se genera automáticamente"
  />
</div>

      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea class="form-control" rows="3" [(ngModel)]="proveedor.notas" name="notas"></textarea>
      </div>

      <div class="mt-4 text-end form-actions d-flex justify-content-end gap-2 flex-wrap">
        <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        <button class="btn btn-success" (click)="guardar()">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
