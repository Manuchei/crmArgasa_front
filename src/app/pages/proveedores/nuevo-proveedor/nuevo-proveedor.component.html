<div class="proveedor-form-page container-fluid mt-4">
  <h2>Nuevo Proveedor</h2>

  <form (ngSubmit)="guardar(formProveedor)" #formProveedor="ngForm">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">Nombre y apellidos o empresa *</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.nombre" name="nombre" #nombre="ngModel"
          required />
        <div class="text-danger mt-1" *ngIf="nombre.invalid && nombre.touched">
          El nombre es obligatorio.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">CIF</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.cif" name="cif" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Fecha alta proveedor</label>
        <input type="date" class="form-control" [(ngModel)]="proveedor.fechaAltaProveedor" name="fechaAltaProveedor" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Oficio</label>
        <select class="form-control" [(ngModel)]="proveedor.oficio" name="oficio">
          <option value="">Seleccione un oficio...</option>
          <option *ngFor="let o of oficios" [value]="o">{{ o }}</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.direccion" name="direccion" />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Localidad</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.localidad" name="localidad" />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Código postal</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.codigoPostal" name="codigoPostal" />
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Provincia</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.provincia" name="provincia" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">País</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.pais" name="pais" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Teléfono *</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.telefono" name="telefono" #telefono="ngModel"
          required />
        <div class="text-danger mt-1" *ngIf="telefono.invalid && telefono.touched">
          El teléfono es obligatorio.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" [(ngModel)]="proveedor.email" name="email" #email="ngModel" required
          email />
        <div class="text-danger mt-1" *ngIf="email.invalid && email.touched">
          Introduce un email válido.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Persona de contacto</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.contacto" name="contacto" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Número de cuenta *</label>
        <input type="text" class="form-control" [(ngModel)]="proveedor.numeroCuenta" name="numeroCuenta"
          #numeroCuenta="ngModel" required pattern="^\d{20}$" placeholder="Ej: 21000418450200051339" inputmode="numeric"
          maxlength="20" (ngModelChange)="formatearNumeroCuenta($event)" />

        <div class="text-danger mt-1" *ngIf="numeroCuenta.touched && numeroCuenta.errors?.['required']">
          El número de cuenta es obligatorio.
        </div>

        <div class="text-danger mt-1" *ngIf="numeroCuenta.touched && numeroCuenta.errors?.['pattern']">
          Debe tener exactamente 20 dígitos.
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">IBAN generado</label>
        <input type="text" class="form-control" [value]="formatearIbanVisual(proveedor.iban)" readonly
          placeholder="Se genera automáticamente" />
      </div>

      <div class="col-12">
        <label class="form-label">Notas</label>
        <textarea class="form-control" rows="3" [(ngModel)]="proveedor.notas" name="notas"></textarea>
      </div>
    </div>

    <hr class="my-4" />

    <div class="text-center mt-4 form-actions">
      <button type="submit" class="btn btn-primary px-5 guardar-btn"
        [disabled]="formProveedor.invalid || !proveedor.iban">
        Guardar
      </button>
    </div>
  </form>
</div>
