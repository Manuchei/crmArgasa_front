<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Crear rutas del día</h2>
    <button class="btn btn-secondary" (click)="volver()">⬅ Volver</button>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="cargando" class="alert alert-info">Guardando...</div>

  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-3">

        <!-- Fecha -->
        <div class="col-md-3">
          <label class="form-label">Fecha</label>
          <input type="date" class="form-control" [(ngModel)]="fecha">
        </div>

        <!-- SELECT Transportista (autocompletar) -->
        <!-- <div class="col-md-3">
          <label class="form-label">Transportista (autocompletar)</label>
          <select id="transportistaSelectDia" #selectTransportistaDia class="form-select" [(ngModel)]="transportistaId"
            (change)="onSelectTransportista(selectTransportistaDia.value)">
            <option value="">-- Selecciona --</option>
            <option *ngFor="let t of transportistas" [value]="t.id">
              {{ t.nombre }}
            </option>
          </select>

        </div> -->

        <!-- Nombre transportista (relleno automático) -->
        <div class="col-md-3">
          <label class="form-label">Transportista</label>
          <input class="form-control" [(ngModel)]="nombreTransportista" placeholder="Nombre">
        </div>

        <!-- Email transportista (relleno automático) -->
        <div class="col-md-3">
          <label class="form-label">Email transportista</label>
          <input type="email" class="form-control" [(ngModel)]="emailTransportista" placeholder="email@...">
        </div>

        <!-- Estado -->
        <div class="col-md-3">
          <label class="form-label">Estado</label>
          <select class="form-select" [(ngModel)]="estado">
            <option value="pendiente">Pendiente</option>
            <option value="en_curso">En curso</option>
            <option value="cerrada">Cerrada</option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Rutas</h5>
        <button class="btn btn-outline-primary btn-sm" (click)="addFila()">➕ Añadir fila</button>
      </div>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th style="width: 22%">Origen</th>
              <th style="width: 22%">Destino</th>
              <th style="width: 20%">Tarea</th>
              <th>Observaciones</th>
              <th style="width: 120px" class="text-center">Acción</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let r of rutas; let i = index">
              <td><input class="form-control" [(ngModel)]="r.origen"></td>
              <td><input class="form-control" [(ngModel)]="r.destino"></td>
              <td>
                <input class="form-control" [(ngModel)]="r.tarea">
              </td>
              <td><input class="form-control" [(ngModel)]="r.observaciones"></td>
              <td class="text-center">
                <button class="btn btn-sm btn-danger" (click)="removeFila(i)">🗑</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="btn btn-success" (click)="guardar()" [disabled]="cargando">
        ✔ Guardar todas
      </button>
    </div>
  </div>
</div>
