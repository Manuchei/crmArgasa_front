<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Facturas (V2)</h2>
  </div>

  <!-- Filtros -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">Filtros</h5>

      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Estado</label>
          <select class="form-select" [(ngModel)]="filtroEstado">
            <option value="">Todas</option>
            <option value="BORRADOR">Borrador</option>
            <option value="EMITIDA">Emitida</option>
            <option value="PAGADA">Pagada</option>
            <option value="ANULADA">Anulada</option>
          </select>
        </div>

        <div class="col-md-6">
          <button class="btn btn-primary w-100" (click)="aplicarFiltros()">Aplicar</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="cargando" class="alert alert-info">Cargando...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="table-responsive" *ngIf="!cargando && (facturas?.length ?? 0) > 0">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Empresa</th>
          <th>Factura</th>
          <th>Fecha</th>
          <th class="text-end">Total</th>
          <th>Estado</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let f of facturas">
          <td>{{ f.id }}</td>
          <td>{{ f.empresa }}</td>
          <td>{{ f.serie }}-{{ f.numero }}</td>
          <td>{{ f.fechaEmision | date:'dd/MM/yyyy' }}</td>
          <td class="text-end">{{ f.total | number:'1.2-2' }} €</td>
          <td>
            <span class="badge bg-warning text-dark" *ngIf="f.estado === 'BORRADOR'">BORRADOR</span>
            <span class="badge bg-success" *ngIf="f.estado === 'EMITIDA'">EMITIDA</span>
            <span class="badge bg-secondary" *ngIf="f.estado === 'PAGADA'">PAGADA</span>
            <span class="badge bg-danger" *ngIf="f.estado === 'ANULADA'">ANULADA</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!cargando && (facturas?.length ?? 0) === 0" class="alert alert-warning text-center">
    No hay facturas.
  </div>
</div>
