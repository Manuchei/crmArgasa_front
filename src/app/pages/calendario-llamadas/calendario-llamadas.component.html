<div class="container mt-4">
  <h2 class="text-center mb-4">📞 Calendario de Llamadas</h2>

  <div class="row g-3">
    <!-- CALENDARIO -->
    <div class="col-lg-8">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>

    <!-- PANEL DERECHO -->
    <div class="col-lg-4">
      <div class="card p-3">
        <ng-container *ngIf="fechaSeleccionada; else noFecha">
          <h5 class="mb-2">Día seleccionado: {{ fechaSeleccionada }}</h5>
          <hr />

          <h6 class="mb-2">Llamadas del día</h6>

          <div *ngIf="llamadasDelDia.length === 0" class="text-muted mb-3">
            No hay llamadas para este día.
          </div>

          <ul class="list-group mb-3" *ngIf="llamadasDelDia.length > 0">
            <li
              class="list-group-item d-flex justify-content-between align-items-center"
              *ngFor="let l of llamadasDelDia"
            >
              <div class="me-2">
                <strong>{{ l.motivo }}</strong><br />
                <small class="text-muted">{{ l.fecha }}</small>
              </div>

              <button
                type="button"
                class="btn btn-sm btn-outline-primary"
                (click)="abrirModalDesdeLista(l.id)"
              >
                Editar
              </button>
            </li>
          </ul>

          <button
            type="button"
            class="btn btn-primary w-100"
            (click)="mostrarFormulario = !mostrarFormulario"
          >
            {{ mostrarFormulario ? 'Cerrar formulario' : 'Añadir llamada' }}
          </button>

          <div class="mt-3" *ngIf="mostrarFormulario">
            <div class="mb-2">
              <label class="form-label">Motivo</label>
              <input
                class="form-control"
                [(ngModel)]="nuevaLlamada.motivo"
                name="motivoNueva"
              />
            </div>

            <div class="mb-2">
              <label class="form-label">Fecha y hora</label>
              <input
                type="datetime-local"
                class="form-control"
                [(ngModel)]="nuevaLlamada.fecha"
                name="fechaNueva"
              />
            </div>

            <div class="mb-2">
              <label class="form-label">Estado</label>
              <select
                class="form-select"
                [(ngModel)]="nuevaLlamada.estado"
                name="estadoNueva"
              >
                <option value="pendiente">pendiente</option>
                <option value="realizada">realizada</option>
                <option value="cancelada">cancelada</option>
              </select>
            </div>

            <div class="mb-2">
              <label class="form-label">Observaciones</label>
              <textarea
                class="form-control"
                [(ngModel)]="nuevaLlamada.observaciones"
                name="obsNueva"
              ></textarea>
            </div>

            <button
              type="button"
              class="btn btn-success w-100"
              (click)="guardarLlamada()"
            >
              Guardar
            </button>
          </div>
        </ng-container>

        <ng-template #noFecha>
          <p class="mb-0">Selecciona un día del calendario para ver o añadir llamadas.</p>
        </ng-template>
      </div>
    </div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div
  class="modal fade"
  id="editarModal"
  tabindex="-1"
  aria-labelledby="editarModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="llamadaSeleccionada">
      <div class="modal-header">
        <h5 class="modal-title" id="editarModalLabel">Editar llamada</h5>

        <!-- ✅ Cierra por Bootstrap + tu método -->
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          (click)="cerrarModal()"
        ></button>
      </div>

      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Motivo</label>
          <input
            class="form-control"
            [(ngModel)]="llamadaSeleccionada.motivo"
            name="motivoEdit"
          />
        </div>

        <div class="mb-2">
          <label class="form-label">Fecha</label>
          <input
            type="datetime-local"
            class="form-control"
            [(ngModel)]="llamadaSeleccionada.fecha"
            name="fechaEdit"
          />
        </div>

        <div class="mb-2">
          <label class="form-label">Estado</label>
          <select
            class="form-select"
            [(ngModel)]="llamadaSeleccionada.estado"
            name="estadoEdit"
          >
            <option value="pendiente">pendiente</option>
            <option value="realizada">realizada</option>
            <option value="cancelada">cancelada</option>
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label">Observaciones</label>
          <textarea
            class="form-control"
            [(ngModel)]="llamadaSeleccionada.observaciones"
            name="obsEdit"
          ></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-danger"
          (click)="eliminarLlamada()"
        >
          Eliminar
        </button>

        <button
          type="button"
          class="btn btn-primary"
          (click)="actualizarLlamada()"
        >
          Guardar cambios
        </button>
      </div>
    </div>
  </div>
</div>
