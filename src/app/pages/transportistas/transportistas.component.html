<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="fw-bold">Transportistas</h2>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
  <div *ngIf="cargando" class="alert alert-info">Cargando...</div>

  <!-- Formulario -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="fw-bold mb-3">
        {{ editId ? 'Editar transportista' : 'Nuevo transportista' }}
      </h5>

      <form [formGroup]="form" (ngSubmit)="guardar()">
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Nombre</label>
            <input class="form-control" formControlName="nombre" placeholder="Ej: Manuel">
            <div class="text-danger mt-1" *ngIf="enviado && f['nombre'].invalid">
              Nombre obligatorio (mínimo 2 caracteres).
            </div>
          </div>

          <div class="col-md-5">
            <label class="form-label">Email</label>
            <input class="form-control" formControlName="email" placeholder="correo@empresa.com">
            <div class="text-danger mt-1" *ngIf="enviado && f['email'].invalid">
              Email obligatorio y válido.
            </div>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit" [disabled]="cargando">
              {{ editId ? 'Actualizar' : 'Crear' }}
            </button>
          </div>
        </div>

        <div class="mt-3" *ngIf="editId">
          <button type="button" class="btn btn-secondary" (click)="cancelarEdicion()">
            Cancelar edición
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-responsive" *ngIf="!cargando && (transportistas?.length ?? 0) > 0">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of transportistas">
          <td>{{ t.id }}</td>
          <td>{{ t.nombre }}</td>
          <td>{{ t.email }}</td>

          <td class="text-center">
            <button class="btn btn-sm btn-primary me-2" (click)="editar(t)">
              ✏️ Editar
            </button>

            <button class="btn btn-sm btn-danger" (click)="eliminar(t)">
              🗑 Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!cargando && (transportistas?.length ?? 0) === 0" class="alert alert-warning text-center">
    No hay transportistas.
  </div>
</div>
