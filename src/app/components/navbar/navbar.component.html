<nav class="navbar navbar-expand-xl navbar-dark bg-dark no-print">
  <div class="container-fluid">

    <!-- EMPRESA ACTIVA -->
    <span class="badge badge-empresa me-2 me-xl-3">
      {{ empresa }}
    </span>

    <!-- BOTÓN HAMBURGUESA -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      aria-controls="navbarNav"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENÚ -->
    <div
      id="navbarNav"
      class="navbar-collapse"
      [class.collapse]="!menuOpen"
      [class.show]="menuOpen"
    >
      <ul class="navbar-nav me-auto">

        <li class="nav-item" *ngIf="canInicio()">
          <a class="nav-link" routerLink="/app/dashboard" routerLinkActive="active" (click)="closeMenu()">
            🏠 Inicio
          </a>
        </li>

        <li class="nav-item" *ngIf="canClientes()">
          <a class="nav-link" routerLink="/app/clientes" routerLinkActive="active" (click)="closeMenu()">
            👥 Clientes
          </a>
        </li>

        <li class="nav-item" *ngIf="canProveedores()">
          <a class="nav-link" routerLink="/app/proveedores" routerLinkActive="active" (click)="closeMenu()">
            🔧 Proveedores
          </a>
        </li>

        <li class="nav-item" *ngIf="canProductos()">
          <a class="nav-link" routerLink="/app/productos" routerLinkActive="active" (click)="closeMenu()">
            📦 Productos
          </a>
        </li>

        <li class="nav-item" *ngIf="canRutas()">
          <a class="nav-link" routerLink="/app/rutas" routerLinkActive="active" (click)="closeMenu()">
            🗺️ Rutas
          </a>
        </li>

        <li class="nav-item" *ngIf="canCalendario()">
          <a class="nav-link" routerLink="/app/calendario" routerLinkActive="active" (click)="closeMenu()">
            📅 Calendario
          </a>
        </li>

        <li class="nav-item" *ngIf="canTransportistas()">
          <a class="nav-link" routerLink="/app/transportistas" routerLinkActive="active" (click)="closeMenu()">
            🚚 Transportistas
          </a>
        </li>

        <li class="nav-item" *ngIf="canInformes()">
          <a class="nav-link" routerLink="/app/informes" routerLinkActive="active" (click)="closeMenu()">
            📊 Informes
          </a>
        </li>

      </ul>

      <div class="navbar-actions d-flex flex-column flex-xl-row align-items-stretch align-items-xl-center">
        <span class="navbar-text user-email me-xl-3 mb-2 mb-xl-0">
          {{ usuario?.email }}
        </span>

        <button
          class="btn btn-outline-warning btn-sm me-xl-2 mb-2 mb-xl-0"
          (click)="cambiarEmpresa(); closeMenu()"
        >
          Cambiar empresa
        </button>

        <button
          class="btn btn-outline-danger btn-sm"
          (click)="logout(); closeMenu()"
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</nav>
