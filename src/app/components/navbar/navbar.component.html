<nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
  <div class="container-fluid">

    <!-- EMPRESA ACTIVA -->
    <span class="badge badge-empresa me-3">
      {{ empresa }}
    </span>

    <!-- BOTÓN HAMBURGUESA -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENÚ -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <!-- Siempre visible -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/app/dashboard" routerLinkActive="active">
            🏠 Inicio
          </a>
        </li>

        <!-- SOLO ADMIN -->
        <ng-container *ngIf="rol?.includes('ADMIN')">
          <li class="nav-item">
            <a class="nav-link" routerLink="/app/clientes" routerLinkActive="active">
              👥 Clientes
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/app/proveedores" routerLinkActive="active">
              🔧 Proveedores
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/app/rutas" routerLinkActive="active">
              🗺️ Rutas
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/app/facturas" routerLinkActive="active">
              🧾 Facturas
            </a>
          </li>

           <li class="nav-item">
            <a class="nav-link" routerLink="/app/productos" routerLinkActive="active">
              🧾 Productos
            </a>
          </li>
        </ng-container>

        <!-- SOLO USER -->
        <ng-container *ngIf="rol?.includes('USER')">
          <li class="nav-item">
            <a class="nav-link" routerLink="/app/clientes" routerLinkActive="active">
              📁 Mis Clientes
            </a>
          </li>
        </ng-container>

        <!-- Siempre visible -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/app/calendario"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            📅 Calendario
          </a>
        </li>
      </ul>

      <!-- Usuario -->
      <span class="navbar-text me-3">
        {{ usuario?.email }}
      </span>

      <!-- Cambiar empresa -->
      <button
        class="btn btn-outline-warning btn-sm me-2"
        (click)="cambiarEmpresa()"
      >
        Cambiar empresa
      </button>

      <!-- Logout -->
      <button
        class="btn btn-outline-danger btn-sm"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
