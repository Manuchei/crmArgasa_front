<nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
  <div class="container-fluid">

    <!-- EMPRESA ACTIVA -->
    <span class="badge badge-empresa me-3">
      {{ empresa }}
    </span>

    <!-- BOTÓN HAMBURGUESA -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- MENÚ -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">

        <!-- Inicio: NO para transportista -->
        <li class="nav-item" *ngIf="canInicio()">
          <a class="nav-link" routerLink="/app/dashboard" routerLinkActive="active">
            🏠 Inicio
          </a>
        </li>

        <!-- ADMIN + USER -->
        <li class="nav-item" *ngIf="canClientes()">
          <a class="nav-link" routerLink="/app/clientes" routerLinkActive="active">
            👥 Clientes
          </a>
        </li>

        <li class="nav-item" *ngIf="canProveedores()">
          <a class="nav-link" routerLink="/app/proveedores" routerLinkActive="active">
            🔧 Proveedores
          </a>
        </li>

        <li class="nav-item" *ngIf="canProductos()">
          <a class="nav-link" routerLink="/app/productos" routerLinkActive="active">
            📦 Productos
          </a>
        </li>

        <!-- ADMIN + TRANSPORTISTA -->
        <li class="nav-item" *ngIf="canRutas()">
          <a class="nav-link" routerLink="/app/rutas" routerLinkActive="active">
            🗺️ Rutas
          </a>
        </li>

        <!-- Calendario: SOLO ADMIN -->
        <li class="nav-item" *ngIf="canCalendario()">
          <a class="nav-link" routerLink="/app/calendario" routerLinkActive="active">
            📅 Calendario
          </a>
        </li>

        <!-- Transportistas: SOLO ADMIN -->
        <li class="nav-item" *ngIf="canTransportistas()">
          <a class="nav-link" routerLink="/app/transportistas" routerLinkActive="active">
            🚚 Transportistas
          </a>
        </li>

      </ul>

      <!-- Usuario -->
      <span class="navbar-text me-3">
        {{ usuario?.email }}
      </span>

      <!-- Cambiar empresa -->
      <button class="btn btn-outline-warning btn-sm me-2" (click)="cambiarEmpresa()">
        Cambiar empresa
      </button>

      <!-- Logout -->
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
