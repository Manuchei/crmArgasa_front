<div class="edit-dialog">
  <header class="dialog-header">
    <span class="dialog-eyebrow">NOVEXAPP / CALENDARIO</span>

    <h2 mat-dialog-title>Editar {{ etiqueta }}</h2>

    <p>Actualiza los datos y la planificación de esta actividad.</p>
  </header>

  <div mat-dialog-content class="dialog-body">
    <div class="section-label">DATOS DE LA ACTIVIDAD</div>

    <div class="dialog-grid">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput [(ngModel)]="nombre" name="nombreEdit" placeholder="Nombre de contacto" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Dirección</mat-label>
        <input matInput [(ngModel)]="direccion" name="direccionEdit" placeholder="Dirección del contacto" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Motivo</mat-label>
      <input matInput [(ngModel)]="titulo" name="tituloEdit" required />
    </mat-form-field>

    <div class="section-label section-separator">PLANIFICACIÓN</div>

    <div class="dialog-grid">
      <mat-form-field appearance="outline">
        <mat-label>Fecha</mat-label>
        <input matInput type="date" [(ngModel)]="fecha" name="fechaEdit" required />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Hora</mat-label>
        <mat-select [(ngModel)]="hora" name="horaEdit" required>
          <mat-option *ngFor="let h of horasDisponibles" [value]="h">
            {{ h }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select [(ngModel)]="estado" name="estadoEdit">
        <mat-option value="pendiente">Pendiente</mat-option>
        <mat-option value="en_progreso">En progreso</mat-option>
        <mat-option value="realizada">Realizada</mat-option>
        <mat-option value="cancelada">Cancelada</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Observaciones</mat-label>
      <textarea matInput rows="3" [(ngModel)]="observaciones" name="observacionesEdit"
        placeholder="Indicaciones o información adicional"></textarea>
    </mat-form-field>

    <div class="dialog-error" *ngIf="error" role="alert">
      {{ error }}
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button type="button" class="dialog-button secondary-button" (click)="cancelar()">
      Cancelar
    </button>

    <button type="button" class="dialog-button primary-button" (click)="guardar()">
      Guardar cambios
    </button>
  </div>
</div>
